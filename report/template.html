<title>Injected Thoughts at Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* Layout: one reading column (~66ch) for the narrative, wider "plates" for figures and
   specimen cards. Specimens are labelled like slides: trial, layer, strength, injected word.
   Amber is reserved for one meaning: the injected concept showing up in text. */
:root {
  --bg: #f2f4f5;
  --paper: #fbfcfc;
  --ink: #111518;
  --ink-2: #45505a;
  --muted: #6f7a84;
  --rule: #d8dee2;
  --rule-2: #e7ebee;
  --amber: #a85f00;
  --hl: rgba(255, 166, 28, 0.32);
  --chip: #e8ecef;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --grid: #e3e6e8;
  --axis: #c2c8cd;
  --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --col: 41rem;
  --plate: 62rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1214; --paper: #151a1d; --ink: #e8ecee; --ink-2: #aeb8c0; --muted: #808b94;
    --rule: #283035; --rule-2: #1f262a; --amber: #f2a541; --hl: rgba(242, 165, 65, 0.28); --chip: #222a2f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --grid: #252c31; --axis: #3a444b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1214; --paper: #151a1d; --ink: #e8ecee; --ink-2: #aeb8c0; --muted: #808b94;
  --rule: #283035; --rule-2: #1f262a; --amber: #f2a541; --hl: rgba(242, 165, 65, 0.28); --chip: #222a2f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --grid: #252c31; --axis: #3a444b; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1.075rem; line-height: 1.62;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 4rem;
  -webkit-font-smoothing: antialiased;
}
main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; justify-items: center; }
main > * { min-width: 0; }
#body-intro { margin-top: 2.2rem; }
.col { width: 100%; max-width: var(--col); }
.plate { width: 100%; max-width: var(--plate); margin-block: 1.6rem 2.2rem; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; letter-spacing: -0.01em; margin: 0; }
h1 { font-size: clamp(2.3rem, 6vw, 4.1rem); line-height: 1.02; font-weight: 750; letter-spacing: -0.025em; }
h2 { font-size: clamp(1.45rem, 3vw, 1.9rem); line-height: 1.15; font-weight: 650; margin-top: 3.2rem; margin-bottom: 0.9rem; }
h3 { font-size: 1.08rem; font-weight: 650; margin-top: 1.6rem; margin-bottom: 0.4rem; }
p { margin: 0 0 1rem; }
a { color: inherit; text-decoration-color: var(--muted); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }
.eyebrow { font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lede { font-size: 1.28rem; line-height: 1.5; color: var(--ink-2); max-width: 38rem; }
.byline { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
hr.sep { border: 0; border-top: 1px solid var(--rule); width: 100%; max-width: var(--col); margin: 2.6rem 0 0; }
code, .tok { font-family: var(--font-mono); font-size: 0.86em; background: var(--chip); padding: 0.06em 0.32em; border-radius: 3px; }
mark { background: var(--hl); color: inherit; border-radius: 2px; padding: 0 0.08em; }
mark.hand { background: transparent; box-shadow: inset 0 -0.42em 0 var(--hl); }
.note { font-size: 0.92rem; color: var(--ink-2); }
.small { font-size: 0.86rem; color: var(--muted); }
ul.plain { padding-left: 1.1rem; margin: 0 0 1rem; }
ul.plain li { margin-bottom: 0.35rem; }

/* hero */
header.hero { width: 100%; max-width: var(--plate); padding-top: 3.2rem; display: grid; gap: 1.2rem; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 2rem; align-items: start; }
@media (max-width: 860px) { .hero-grid { grid-template-columns: minmax(0, 1fr); } }

/* specimen cards */
.specimen { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; min-width: 0; }
.specimen .strip { display: flex; flex-wrap: wrap; gap: 0.3rem 0.9rem; align-items: baseline; padding: 0.55rem 0.9rem;
  border-bottom: 1px solid var(--rule); font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); letter-spacing: 0.02em; }
.specimen .strip b { color: var(--ink); font-weight: 600; }
.specimen .strip .inj { color: var(--amber); font-weight: 600; }
.specimen .chan { padding: 0.75rem 0.9rem 0.85rem; display: grid; gap: 0.3rem; min-width: 0; }
.specimen .chan + .chan { border-top: 1px dashed var(--rule); }
.specimen .chan .lab { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); letter-spacing: 0.04em; }
.specimen .chan .txt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.97rem; line-height: 1.5; }
.specimen .chan .txt.clamp { display: -webkit-box; -webkit-line-clamp: 9; -webkit-box-orient: vertical; overflow: hidden; }
.specimen .chan button.expand { justify-self: start; font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.specimen .chan.analysis .txt { font-family: var(--font-mono); font-size: 0.82rem; line-height: 1.55; color: var(--ink-2); }
.specimen .foot { padding: 0.5rem 0.9rem; border-top: 1px solid var(--rule); font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); gap: 1rem; align-items: start; }
.cards.cards-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr)); }

/* figures */
figure { margin: 0; }
figure .fig-head { display: grid; gap: 0.25rem; margin-bottom: 0.8rem; max-width: var(--col); }
figure .fig-title { font-family: var(--font-display); font-weight: 650; font-size: 1.05rem; }
figure .fig-sub { font-size: 0.92rem; color: var(--ink-2); }
.chart { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 0.9rem 0.9rem 0.6rem; min-width: 0; overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; min-width: 540px; }
.chart text { font-family: var(--font-mono); font-size: 11px; fill: var(--muted); }
.chart text.ink { fill: var(--ink); }
.chart text.ink2 { fill: var(--ink-2); }
.legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1.1rem; font-family: var(--font-mono); font-size: 0.74rem; color: var(--ink-2); margin: 0.2rem 0 0.6rem; }
.legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
.key-line { width: 16px; height: 2px; border-radius: 1px; display: inline-block; }
.key-box { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
details.tablev { margin-top: 0.5rem; font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-2); }
details.tablev summary { cursor: pointer; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
table.data { border-collapse: collapse; margin-top: 0.4rem; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: 0.25rem 0.6rem; border-bottom: 1px solid var(--rule-2); text-align: right; white-space: nowrap; }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data th { color: var(--muted); font-weight: 500; }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: 0.8rem; }
.tile { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 0.85rem 0.95rem; display: grid; gap: 0.15rem; align-content: start; }
.tile .k { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.03em; }
.tile .v { font-family: var(--font-display); font-weight: 650; font-size: 1.9rem; line-height: 1.1; }
.tile .d { font-size: 0.86rem; color: var(--ink-2); }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 0.5rem 0.8rem; align-items: center; margin-bottom: 0.9rem; font-family: var(--font-mono); font-size: 0.78rem; }
.controls label { color: var(--muted); display: inline-flex; gap: 0.35rem; align-items: center; }
select, button.seg { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 0.3rem 0.5rem; }
.segs { display: inline-flex; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; }
.segs button { font: inherit; font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-2); background: var(--paper); border: 0; border-right: 1px solid var(--rule); padding: 0.35rem 0.6rem; cursor: pointer; }
.segs button:last-child { border-right: 0; }
.segs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
button.more { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 4px; padding: 0.4rem 0.8rem; cursor: pointer; margin-top: 0.8rem; }

/* tooltip */
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--paper); color: var(--ink); border: 1px solid var(--rule);
  border-radius: 5px; padding: 0.45rem 0.6rem; font-family: var(--font-mono); font-size: 0.74rem; line-height: 1.45; box-shadow: 0 4px 18px rgba(0,0,0,0.12); max-width: 16rem; }
#tip .tv { font-weight: 600; font-size: 0.86rem; }
#tip .row { display: flex; align-items: center; gap: 0.4rem; }

/* diagram */
.diagram text { font-family: var(--font-mono); font-size: 11px; fill: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
}
.footer { width: 100%; max-width: var(--col); margin-top: 3rem; border-top: 1px solid var(--rule); padding-top: 1rem; }

/* voice note under the byline */
.voice { font-size: 0.92rem; line-height: 1.5; color: var(--ink-2); background: var(--paper); border: 1px solid var(--rule); border-left: 3px solid var(--amber); border-radius: 5px; padding: 0.7rem 0.9rem; max-width: 38rem; margin: 0; }
.voice strong { color: var(--ink); }

/* Glosses: a term with a short definition. Wide screens show the definition in the right margin
   beside the line (Distill/Tufte-style); narrow screens, the hero and figure captions show it inline
   when the term is tapped. Print always shows it inline in brackets. */
.col { display: flow-root; }
.gl { display: inline; }
.gl-t { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: help;
  text-decoration: underline dotted var(--muted); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.sn { display: none; font-family: var(--font-body); font-size: 0.86rem; line-height: 1.45; color: var(--ink-2); font-style: normal; font-weight: 400; }
.gl.open .sn { display: block; margin: 0.35rem 0 0.55rem; padding: 0.45rem 0.65rem; background: var(--chip); border-radius: 4px; }
@media (min-width: 1180px) {
  .col p .sn, .col li .sn { display: block; float: right; clear: right; width: 13rem; margin: 0.15rem -15rem 0.6rem 0; padding: 0 0 0 0.7rem; background: none; border-left: 2px solid var(--rule); }
  .col .gl.open .sn { border-left-color: var(--amber); }
  .col .gl-t { cursor: default; }
}

/* collapsed appendix blocks */
details.appx { border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); padding: 0.2rem 0.9rem; margin: 0 0 1rem; }
details.appx > summary { cursor: pointer; font-family: var(--font-display); font-weight: 650; padding: 0.55rem 0; }
details.appx[open] > summary { border-bottom: 1px solid var(--rule-2); margin-bottom: 0.7rem; }

/* per-concept table: let the long headers wrap so the six columns fit */
table.data.wrap-head th { white-space: normal; vertical-align: bottom; min-width: 5.5rem; max-width: 9rem; line-height: 1.3; }
table.data.wrap-head th:first-child { min-width: 0; }

@media print {
  body { background: #fff; }
  .sn, .gl.open .sn { display: inline !important; float: none !important; width: auto !important; margin: 0 !important; padding: 0 !important; border: 0 !important; background: none !important; font-size: 0.86em; }
  .sn::before { content: " ("; }
  .sn::after { content: ")"; }
  .gl-t { text-decoration: none; }
  details.appx { border: 0; padding: 0; }
  details.appx > summary { list-style: none; }
  .chart svg, .specimen, tr, figure .fig-head { break-inside: avoid; }
  figure .fig-head { break-after: avoid; }
  thead { display: table-header-group; }
  .tbl-wrap { overflow: visible; }
}
</style>

<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const P = JSON.parse(document.getElementById("prose").textContent);
const SVGNS = "http://www.w3.org/2000/svg";

/* ---------- small DOM helpers (all text goes in via textContent) ---------- */
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}
function sv(tag, attrs, ...kids) {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) n.setAttribute(k, v);
  for (const c of kids.flat()) if (c != null) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}
const pct = (x, d = 0) => (x == null || isNaN(x)) ? "–" : (100 * x).toFixed(d) + "%";
const fmtS = s => s === 0 ? "0" : String(s).replace(/^0\./, ".");
const STEMS = D.stems;
function stemRe(c) { return new RegExp(STEMS[c] || c, "gi"); }

/* Inline markup for prose: [[term|gloss]], **bold**, *italic*, `code`, ==highlight==, [text](url), {stat:key}. */
let GLOSS_N = 0;
function rich(text) {
  text = String(text).replace(/\{([a-zA-Z0-9_.]+)\}/g, (m, k) => (STAT[k] != null ? String(STAT[k]) : m));
  const frag = document.createDocumentFragment();
  const re = /(\[\[[^\]|]+\|[^\]]+\]\]|\*\*[^*]+\*\*|\*[^*]+\*|`[^`]+`|==[^=]+==|\[[^\]]+\]\([^)]+\)|\{[a-zA-Z0-9_.]+\})/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) frag.append(text.slice(last, m.index));
    const t = m[0];
    if (t.startsWith("[[")) {
      const bar = t.indexOf("|");
      const term = t.slice(2, bar), def = t.slice(bar + 1, -2);
      const id = "gl" + (++GLOSS_N);
      const wrap = el("span", { class: "gl" });
      const btn = el("button", { class: "gl-t", type: "button", "aria-expanded": "false", "aria-controls": id }, rich(term));
      btn.addEventListener("click", () => { const o = wrap.classList.toggle("open"); btn.setAttribute("aria-expanded", o ? "true" : "false"); });
      wrap.append(btn, el("span", { class: "sn", id, role: "note" }, rich(def)));
      frag.append(wrap);
    }
    else if (t.startsWith("**")) frag.append(el("strong", {}, t.slice(2, -2)));
    else if (t.startsWith("`")) frag.append(el("code", {}, t.slice(1, -1)));
    else if (t.startsWith("==")) frag.append(el("mark", { class: "hand" }, t.slice(2, -2)));
    else if (t.startsWith("[")) { const mm = t.match(/^\[([^\]]+)\]\(([^)]+)\)$/); frag.append(el("a", { href: mm[2], target: "_blank", rel: "noopener" }, mm[1])); }
    else if (t.startsWith("{")) frag.append(String(STAT[t.slice(1, -1)] ?? ("[" + t + "]")));
    else frag.append(el("em", {}, t.slice(1, -1)));
    last = m.index + t.length;
  }
  if (last < text.length) frag.append(text.slice(last));
  return frag;
}
function proseInto(id, blocks) {
  const host = document.getElementById(id);
  if (!host || !blocks) return;
  for (const b of blocks) {
    if (typeof b === "string") host.append(el("p", {}, rich(b)));
    else if (b.h2) host.append(el("h2", { id: b.id || null }, rich(b.h2)));
    else if (b.h3) host.append(el("h3", {}, rich(b.h3)));
    else if (b.ul) host.append(el("ul", { class: "plain" }, b.ul.map(x => el("li", {}, rich(x)))));
    else if (b.note) host.append(el("p", { class: "note" }, rich(b.note)));
    else if (b.details) {
      const d = el("details", { class: "appx" }, el("summary", {}, rich(b.details)));
      const inner = el("div", {});
      d.append(inner);
      host.append(d);
      proseIntoNode(inner, b.blocks || []);
    }
  }
}
function proseIntoNode(node, blocks) {
  const tmp = "tmp-" + Math.random().toString(36).slice(2);
  node.id = tmp;
  proseInto(tmp, blocks);
  node.removeAttribute("id");
}

/* Highlight the injected concept's own word stem (objective), or hand-picked phrases. */
function highlighted(text, concept, phrases) {
  const frag = document.createDocumentFragment();
  if (!text) { frag.append(el("span", { class: "small" }, "(nothing — generation ended before this channel)")); return frag; }
  const parts = text.split(/\*\*([^*\n]{1,200}?)\*\*/g);
  if (parts.length > 1) {
    parts.forEach((seg, i) => { if (!seg) return; const f = highlightedPlain(seg, concept, phrases); frag.append(i % 2 ? el("strong", {}, f) : f); });
    return frag;
  }
  return highlightedPlain(text, concept, phrases);
}
function highlightedPlain(text, concept, phrases) {
  const frag = document.createDocumentFragment();
  const pats = [];
  if (concept) pats.push(STEMS[concept] || concept);
  for (const p of (phrases || [])) pats.push(p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!pats.length) { frag.append(text); return frag; }

function niceTicks(lo, hi, n = 5) {
  const span = hi - lo || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(st => span / st <= n) || 10 * mag;
  const t0 = Math.floor(lo / step) * step, out = [];
  for (let v = t0; v <= hi + step * 0.001; v += step) out.push(+v.toFixed(10));
  return { ticks: out, step };
}
function renderControl() {
  const ce = D.control_exp || [];
  if (!ce.length || !ce[0].tF) return;
  const layers = Object.keys(ce[0].tF).map(Number).sort((a, b) => a - b);
  const byC = {};
  ce.forEach(r => { (byC[r.c] = byC[r.c] || {})[r.think] = r; });
  const pairs = Object.values(byC).filter(p => p[true] && p[false]);
  const mentions = r => new RegExp("\\b" + r.c.replace(/s$/, ""), "i").test(r.A || "");
  function series(sub) {
    const ps = sub ? pairs.filter(p => !mentions(p[true])) : pairs;
    const mean = [], lo = [], hi = [], pos = [];
    layers.forEach(L => {
      const d = ps.map(p => (p[true].tF[L] - p[true].oF[L]) - (p[false].tF[L] - p[false].oF[L]));
      const m = d.reduce((a, b) => a + b, 0) / d.length;
      const sd = Math.sqrt(d.reduce((a, b) => a + (b - m) ** 2, 0) / Math.max(1, d.length - 1));
      const se = sd / Math.sqrt(d.length);
      mean.push(m); lo.push(m - 1.96 * se); hi.push(m + 1.96 * se); pos.push(d.filter(x => x > 0).length + " of " + d.length);
    });
    return { mean, lo, hi, pos, n: ps.length };
  }
  const A = series(false), B = series(true);
  const all = [...A.lo, ...A.hi, ...B.lo, ...B.hi, 0];
  const { ticks } = niceTicks(Math.min(...all), Math.max(...all), 5);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const f = xyFrame(720, 300, { l: 56, r: 130, t: 14, b: 40 });
  const svg = sv("svg", { viewBox: `0 0 ${f.w} ${f.h}`, role: "img" });
  const ys = v => f.m.t + f.ih - (v - y0) / (y1 - y0) * f.ih;
  const xs = L => f.m.l + (L - layers[0]) / (layers[layers.length - 1] - layers[0]) * f.iw;
  ticks.forEach(v => { const y = ys(v); svg.append(sv("line", { x1: f.m.l, x2: f.m.l + f.iw, y1: y, y2: y, stroke: Math.abs(v) < 1e-12 ? "var(--axis)" : "var(--grid)" })); svg.append(sv("text", { x: f.m.l - 8, y: y + 4, "text-anchor": "end" }, v.toFixed(3))); });
  layers.filter(L => L % 4 === 0).forEach(L => svg.append(sv("text", { x: xs(L), y: f.m.t + f.ih + 18, "text-anchor": "middle" }, String(L))));
  svg.append(sv("text", { x: f.m.l + f.iw / 2, y: f.h - 4, "text-anchor": "middle" }, "layer"));
  const band = "M" + layers.map((L, i) => xs(L) + "," + ys(A.hi[i])).join("L") + "L" + layers.slice().reverse().map((L, j) => { const i = layers.length - 1 - j; return xs(L) + "," + ys(A.lo[i]); }).join("L") + "Z";
  svg.append(sv("path", { d: band, fill: "var(--s2)", opacity: 0.1 }));
  const S = [{ name: `all ${A.n} word pairs`, short: "all pairs", v: A.mean, color: "var(--s2)", pos: A.pos },
             { name: `the ${B.n} pairs whose reasoning never names the word`, short: "never named", v: B.mean, color: "var(--s7)", pos: B.pos }];
  S.forEach(s_ => {
    svg.append(sv("path", { d: "M" + layers.map((L, i) => xs(L) + "," + ys(s_.v[i])).join("L"), fill: "none", stroke: s_.color, "stroke-width": 2, "stroke-linejoin": "round" }));
  });
  const i = layers.length - 1;
  const ya = ys(S[0].v[i]), yb = ys(S[1].v[i]);
  const sep = Math.abs(ya - yb) < 14 ? (ya < yb ? [-7, 7] : [7, -7]) : [0, 0];
  svg.append(sv("text", { x: xs(layers[i]) + 8, y: ya + 4 + sep[0], class: "ink2" }, S[0].short));
  svg.append(sv("text", { x: xs(layers[i]) + 8, y: yb + 4 + sep[1], class: "ink2" }, S[1].short));
  const hair = sv("line", { y1: f.m.t, y2: f.m.t + f.ih, stroke: "var(--axis)", visibility: "hidden" }); svg.append(hair);
  const hit = sv("rect", { x: f.m.l, y: f.m.t, width: f.iw, height: f.ih, fill: "transparent" }); svg.append(hit);
  hit.addEventListener("pointermove", e => { const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width * f.w; let bi = 0, bd = 1e9; layers.forEach((L, k) => { const d = Math.abs(xs(L) - px); if (d < bd) { bd = d; bi = k; } });
    hair.setAttribute("x1", xs(layers[bi])); hair.setAttribute("x2", xs(layers[bi])); hair.setAttribute("visibility", "visible");
    showTip(e, [{ text: `layer ${layers[bi]}` }, ...S.map(s_ => ({ value: s_.v[bi].toFixed(4), label: `${s_.short} (higher in ${s_.pos[bi]})`, color: s_.color }))]); });
  hit.addEventListener("pointerleave", () => { hair.setAttribute("visibility", "hidden"); hideTip(); });
  const wrap = el("div", { class: "chart" }, el("div", { class: "legend" }, S.map(s_ => el("span", {}, el("span", { class: "key-line", style: `background:${s_.color}` }), s_.name))), svg);
  const rows = layers.map((L, k) => [String(L), A.mean[k].toFixed(4), A.pos[k], B.mean[k].toFixed(4), B.pos[k]]);
  figure("fig-control", "How much more the word shows up when it's asked for", P.controlSub || "", wrap,
    tableView(["layer", "all pairs: difference", "pairs higher", "word never in reasoning: difference", "pairs higher"], rows));
}

  const mk = (id, label, opts) => el("label", {}, label, el("select", { id }, opts.map(([v, t]) => el("option", { value: v }, t))));
  const controls = el("div", { class: "controls" },
    mk("b-pool", "run ", [["low", "main (low effort)"], ...(MED.length ? [["medium", "medium effort"]] : []), ...(PERM.length ? [["permission", "with permission"]] : [])]),
    mk("b-kind", "kind ", [["inject", "injected"], ["control", "control"], ["random", "random vector"], ["all", "all"]]),
    mk("b-L", "layer ", [["all", "all"], ...LAYERS.map(L => [String(L), String(L)])]),
    mk("b-s", "strength ", [["all", "all"], ...STRENGTHS.map(s => [String(s), fmtS(s)])]),
    mk("b-c", "concept ", [["all", "all"], ...D.concepts.map(c => [c, c])]),
    mk("b-cls", "answer ", [["all", "all"], ...CLS_ORDER.map((c, i) => [c, CLS_SHORT[i]])]));
  const count = el("div", { class: "small", style: "margin-bottom:.6rem" });
  const list = el("div", { class: "cards" });
  const more = el("button", { class: "more", type: "button" }, "Show more");
  function filtered() {
    return (pools[state.pool] || []).filter(t => (state.kind === "all" || t.k === state.kind) && (state.L === "all" || String(t.L) === state.L) &&
      (state.s === "all" || String(t.s) === state.s) && (state.c === "all" || t.c === state.c) && (state.cls === "all" || t.cls === state.cls));
  }
  function draw() {
    const f = filtered();
    count.textContent = `${f.length} trial${f.length === 1 ? "" : "s"} match`;
    list.replaceChildren(...f.slice(0, state.shown).map(t => specimen(t)));
    more.hidden = f.length <= state.shown;
  }
  controls.addEventListener("change", e => {
    const id = e.target.id.replace("b-", "");
    state[id === "pool" ? "pool" : id] = e.target.value; state.shown = 12; draw();
  });
  more.addEventListener("click", () => { state.shown += 12; draw(); });
  host.append(el("p", { class: "note" }, rich(P.browserNote || "")), controls, count, list, more);
  draw();
}

render();
</script>
